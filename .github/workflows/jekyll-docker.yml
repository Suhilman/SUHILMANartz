# Nama workflow yang akan muncul di tab Actions
name: Deploy React App to GitHub Pages

on:
  # Workflow ini akan berjalan setiap kali ada push ke branch "main"
  push:
    branches: ["main"]

  # Memungkinkan Anda menjalankan workflow ini secara manual dari tab Actions
  workflow_dispatch:

# Izin yang diperlukan agar Actions bisa menulis ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Pengaturan agar hanya satu deployment yang berjalan pada satu waktu
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Nama job utama
  build-and-deploy:
    # Menggunakan server virtual Ubuntu versi terbaru
    runs-on: ubuntu-latest

    steps:
      # Langkah 1: Mengunduh kode dari repositori Anda
      - name: Checkout
        uses: actions/checkout@v4

      # Langkah 2: Menyiapkan lingkungan Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Menggunakan Node.js versi 18
          cache: 'npm'     # Mengaktifkan cache untuk 'npm' agar instalasi lebih cepat

      # Langkah 3: Menginstall semua dependensi dari package.json
      - name: Install dependencies
        run: npm install

      # Langkah 4: Membangun versi produksi dari aplikasi React Anda
      - name: Build
        run: npm run build # Menjalankan script "build" yang ada di package.json

      # Langkah 5: Mengkonfigurasi GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Langkah 6: Mengunggah hasil build (folder 'build') sebagai artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Path ke folder hasil build. Pastikan ini sesuai dengan proyek Anda.
          # Untuk Create React App, defaultnya adalah 'build'.
          path: './build'

      # Langkah 7: Melakukan deployment ke GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
