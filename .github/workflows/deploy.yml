name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Pastikan ini sesuai dengan nama branch utama kamu

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Baris cache dihapus agar tidak error jika package-lock.json belum di-push
          # Jika ingin performa lebih cepat, pastikan package-lock.json ada di repo baru aktifkan lagi

      - name: Install and Build 🔧
        run: |
          npm install
          npm run build --if-present

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # Catatan: Jika kamu menggunakan Vite, ganti 'build' menjadi 'dist'
          # Jika menggunakan Create React App, tetap gunakan 'build'
          folder: build 
          branch: gh-pages
