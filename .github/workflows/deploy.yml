name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Pastikan ini sesuai dengan nama branch utama kamu

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Cache dimatikan sementara agar lebih stabil jika package-lock bermasalah

      - name: Install and Build 🔧
        run: |
          npm install
          # CI=false ditambahkan agar peringatan ESLint (unused vars dll) tidak menggagalkan build
          CI=false npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # Karena kamu menggunakan react-scripts (CRA), folder outputnya adalah 'build'
          folder: build 
          branch: gh-pages
